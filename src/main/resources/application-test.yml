spring:
  datasource:
    # 테스트 실행 중 메모리에만 존재하는 H2 DB.
    #
    # 테스트가 끝나면 데이터도 사라진다.
    url: jdbc:h2:mem:dietdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 테스트 시작 시 테이블을 생성하고
      # 테스트 종료 시 제거한다.
      #
      # 테스트 간 DB 상태가 남지 않게 하기 좋다.
      ddl-auto: create-drop

    show-sql: true

    properties:
      hibernate:
        format_sql: true